[project]
name = "flowix-transcoder"
version = "0.1.0"
description = "Flowix Transcoding Worker — pika + FFmpeg"
requires-python = ">=3.14"
dependencies = [
  # issue #62: celery/redis/boto3/pydantic удалены — воркер на pika, стабы не используются
  "minio>=7.2,<8",
  "pika>=1.3",
  "requests>=2.32",
  "prometheus_client>=0.21",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "black>=24",
  "flake8>=7",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
