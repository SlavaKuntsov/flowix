services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c password_encryption=md5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowix}
      POSTGRES_DB: ${POSTGRES_DB:-flowix}
      # Phase 15: pgbouncer uses md5, so postgres must store md5 hashes (scram breaks pgbouncer md5)
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Legacy fallback for fresh volume — primary migrations are golang-migrate (deploy/migrations)
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowix} -d ${POSTGRES_DB:-flowix}"]
      interval: 5s
      retries: 10

  # Phase 15 cost: PgBouncer in transaction mode to reduce Postgres connections (pool_size tuned in services/auth & metadata)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-flowix}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-flowix}
      DB_NAME: ${POSTGRES_DB:-flowix}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-100}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 2
      ADMIN_USERS: ${POSTGRES_USER:-flowix}
      AUTH_TYPE: md5
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -h postgres -p 5432 -U ${POSTGRES_USER:-flowix} -d ${POSTGRES_DB:-flowix} -c 'SELECT 1' >/dev/null 2>&1 || pg_isready -h postgres -p 5432 -U ${POSTGRES_USER:-flowix} -d ${POSTGRES_DB:-flowix}"]
      interval: 10s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://flowix:flowix@postgres:5432/flowix?sslmode=disable", "up"]
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      /usr/bin/mc mb -p local/$${VIDEO_STORAGE_BUCKET:-videos} || true &&
      /usr/bin/mc anonymous set private local/$${VIDEO_STORAGE_BUCKET:-videos} || true &&
      /usr/bin/mc anonymous set download local/$${VIDEO_STORAGE_BUCKET:-videos}/renditions || true &&
      /usr/bin/mc anonymous set download local/$${VIDEO_STORAGE_BUCKET:-videos}/thumbnails || true &&
      /usr/bin/mc anonymous set private local/$${VIDEO_STORAGE_BUCKET:-videos}/raw || true &&
      echo '[minio-setup] bucket policy: private + renditions/thumbnails download, raw private' &&
      (/usr/bin/mc ilm rule add local/$${VIDEO_STORAGE_BUCKET:-videos} --expire-days '7' --prefix 'raw/' 2>/dev/null && echo '[minio-setup] ilm raw 7d added (rule)') || (/usr/bin/mc ilm add local/$${VIDEO_STORAGE_BUCKET:-videos} --expiry-days '7' --prefix 'raw/' 2>/dev/null && echo '[minio-setup] ilm raw 7d added (legacy)') || echo '[minio-setup] ilm raw already exists or skipped' &&
      /usr/bin/mc ilm ls local/$${VIDEO_STORAGE_BUCKET:-videos} 2>/dev/null | head -n 20 || true &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      VIDEO_STORAGE_BUCKET: ${VIDEO_STORAGE_BUCKET:-videos}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-flowix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-flowix}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10

   # Phase 5: nginx-vod JIT (kaltura/nginx-vod-module) — maps 3 MP4s to HLS via MinIO
  nginx-vod:
    build: ./nginx
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    depends_on:
      minio:
        condition: service_healthy
      metadata:
        condition: service_healthy
    ports:
      - "${NGINX_VOD_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health | grep -q ok || curl -f http://127.0.0.1:80/health"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 3s

  # App services — built in later phases, kept here for routing
  auth:
    build: ../services/auth
    environment:
      DATABASE_URL: postgres://flowix:flowix@postgres:5432/flowix?sslmode=disable
      # Phase 15: set PGBOUNCER_ENABLED=true to route via pgbouncer:5432 (pooled)
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      RABBITMQ_URL: amqp://flowix:flowix@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "${AUTH_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  metadata:
    build: ../services/metadata
    environment:
      DATABASE_URL: postgres://flowix:flowix@postgres:5432/flowix?sslmode=disable
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      VIDEO_STORAGE_BUCKET: ${VIDEO_STORAGE_BUCKET:-videos}
    ports:
      - "${METADATA_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  upload:
    build: ../services/upload
    environment:
      DATABASE_URL: postgres://flowix:flowix@postgres:5432/flowix?sslmode=disable
      RABBITMQ_URL: amqp://flowix:flowix@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      VIDEO_STORAGE_BUCKET: ${VIDEO_STORAGE_BUCKET:-videos}
      METADATA_URL: http://metadata:8002
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5368709120}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports:
      - "${UPLOAD_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      metadata:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  transcoder:
    build: ../services/transcoder
    environment:
      RABBITMQ_URL: amqp://flowix:flowix@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      VIDEO_STORAGE_BUCKET: ${VIDEO_STORAGE_BUCKET:-videos}
      METADATA_URL: http://metadata:8002
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-veryfast}
      ENCODE_MODE: ${ENCODE_MODE:-cbr}
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-auto}
      TRANSCODER_PIPE_INPUT: ${TRANSCODER_PIPE_INPUT:-true}
      KEEP_RAW: ${KEEP_RAW:-false}
      METRICS_PORT: ${TRANSCODER_METRICS_PORT:-8004}
    ports:
      - "${TRANSCODER_METRICS_PORT:-8004}:8004"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      metadata:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.consumer' >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s

  gateway:
    build: ../services/gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5368709120}
      AUTH_URL: http://auth:8001
      METADATA_URL: http://metadata:8002
      UPLOAD_URL: http://upload:8003
      VOD_URL: http://nginx-vod:80
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      metadata:
        condition: service_healthy
      upload:
        condition: service_healthy
      nginx-vod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_PORT:-8080}
        GATEWAY_URL: http://gateway:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_PORT:-8080}
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok || curl -f http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || curl -f http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  rabbitdata:
  promdata:
  grafanadata:
  lokidata:
