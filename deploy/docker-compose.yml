services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowix}
      POSTGRES_DB: ${POSTGRES_DB:-flowix}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Legacy fallback for fresh volume — primary migrations are golang-migrate (deploy/migrations)
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowix} -d ${POSTGRES_DB:-flowix}"]
      interval: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://flowix:flowix@postgres:5432/flowix?sslmode=disable", "up"]
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      /usr/bin/mc mb -p local/$${VIDEO_STORAGE_BUCKET:-videos} || true &&
      /usr/bin/mc anonymous set private local/$${VIDEO_STORAGE_BUCKET:-videos} || true &&
      /usr/bin/mc anonymous set download local/$${VIDEO_STORAGE_BUCKET:-videos}/renditions || true &&
      /usr/bin/mc anonymous set download local/$${VIDEO_STORAGE_BUCKET:-videos}/thumbnails || true &&
      /usr/bin/mc anonymous set private local/$${VIDEO_STORAGE_BUCKET:-videos}/raw || true &&
      echo '[minio-setup] bucket policy: private + renditions/thumbnails download, raw private' &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      VIDEO_STORAGE_BUCKET: ${VIDEO_STORAGE_BUCKET:-videos}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-flowix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-flowix}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10

   # Phase 5: nginx-vod JIT (kaltura/nginx-vod-module) — maps 3 MP4s to HLS via MinIO
  nginx-vod:
    build: ./nginx
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    depends_on:
      minio:
        condition: service_healthy
      metadata:
        condition: service_healthy
    ports:
      - "${NGINX_VOD_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health | grep -q ok || curl -f http://127.0.0.1:80/health"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 3s

  # App services — built in later phases, kept here for routing
  auth:
    build: ../services/auth
    environment:
      DATABASE_URL: postgres://flowix:flowix@postgres:5432/flowix?sslmode=disable
      RABBITMQ_URL: amqp://flowix:flowix@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "${AUTH_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  metadata:
    build: ../services/metadata
    environment:
      DATABASE_URL: postgres://flowix:flowix@postgres:5432/flowix?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    ports:
      - "${METADATA_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  upload:
    build: ../services/upload
    environment:
      DATABASE_URL: postgres://flowix:flowix@postgres:5432/flowix?sslmode=disable
      RABBITMQ_URL: amqp://flowix:flowix@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      VIDEO_STORAGE_BUCKET: ${VIDEO_STORAGE_BUCKET:-videos}
      METADATA_URL: http://metadata:8002
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5368709120}
    ports:
      - "${UPLOAD_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      metadata:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  transcoder:
    build: ../services/transcoder
    environment:
      RABBITMQ_URL: amqp://flowix:flowix@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      VIDEO_STORAGE_BUCKET: ${VIDEO_STORAGE_BUCKET:-videos}
      METADATA_URL: http://metadata:8002
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-veryfast}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      metadata:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.consumer' >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s

  gateway:
    build: ../services/gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5368709120}
      AUTH_URL: http://auth:8001
      METADATA_URL: http://metadata:8002
      UPLOAD_URL: http://upload:8003
      VOD_URL: http://nginx-vod:80
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      metadata:
        condition: service_healthy
      upload:
        condition: service_healthy
      nginx-vod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_PORT:-8080}
        GATEWAY_URL: http://gateway:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_PORT:-8080}
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  rabbitdata:
