# Flowix production overrides — CDN-friendly HLS + hardened defaults.
# Usage: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up --build -d
services:
  nginx-vod:
    environment:
      TZ: UTC
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro

  gateway:
    environment:
      ENV: prod
      LOG_FORMAT: json
      LOG_LEVEL: warn
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: unless-stopped

  auth:
    environment:
      ENV: prod
      LOG_LEVEL: warn
    deploy:
      resources:
        limits:
          memory: 512M

  metadata:
    environment:
      ENV: prod
      LOG_LEVEL: warn

  upload:
    environment:
      ENV: prod
      LOG_LEVEL: warn

  transcoder:
    environment:
      ENV: prod
      LOG_LEVEL: warn

  frontend:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
