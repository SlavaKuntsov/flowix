load_module modules/ngx_http_vod_module.so;

worker_processes auto;

events { worker_connections 1024; }

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nodelay on;

  vod_metadata_cache metadata_cache 512m;
  vod_mapping_cache mapping_cache 5m;
  vod_response_cache response_cache 512m;
  vod_performance_counters perf_counters 1m;
  vod_max_mapping_response_size 16k;
  vod_max_upstream_headers_size 4k;
  vod_last_modified_types *;
  vod_segment_duration 2000;
  vod_align_segments_to_key_frames on;
  vod_manifest_segment_durations_mode accurate;
  resolver 127.0.0.11 valid=30s;

  # gzip for manifests
  gzip on;
  gzip_types application/vnd.apple.mpegurl application/x-mpegURL text/plain;

  server {
    listen 80;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Security / prod headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /health {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location ~ "^/mapping/(?:hls/)?(?<video_id>[0-9a-fA-F-]{36})$" {
      internal;
      proxy_pass http://metadata:8002/internal/videos/$video_id/vod;
      proxy_set_header Host metadata;
      proxy_set_header X-Internal-Token "${INTERNAL_TOKEN}";
    }

    location ^~ /minio/ {
      internal;
      proxy_pass http://minio:9000/videos/;
      proxy_set_header Host minio;
      proxy_buffering off;
    }

    # HLS manifests — short cache, CDN revalidates; segments — immutable long cache
    location ~ "^/hls/[0-9a-fA-F-]{36}/.*\\.m3u8$" {
      vod hls;
      vod_mode mapped;
      vod_upstream_location /mapping;
      vod_remote_upstream_location /minio;

      expires 10s;
      add_header Cache-Control "public, max-age=10, stale-while-revalidate=30" always;
      add_header CDN-Cache-Control "public, max-age=10" always;
      add_header Surrogate-Control "max-age=10" always;
    }

    location ~ "^/hls/[0-9a-fA-F-]{36}/" {
      vod hls;
      vod_mode mapped;
      vod_upstream_location /mapping;
      vod_remote_upstream_location /minio;

      # segments are content-addressed via rendition MP4 → immutable
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
      add_header Surrogate-Control "max-age=31536000" always;
    }
  }
}
