load_module modules/ngx_http_vod_module.so;

worker_processes auto;

events { worker_connections 1024; }

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nodelay on;

  vod_metadata_cache metadata_cache 512m;
  vod_mapping_cache mapping_cache 5m;
  vod_response_cache response_cache 512m;
  vod_max_mapping_response_size 16k;
  vod_max_upstream_headers_size 4k;
  vod_last_modified_types *;
  vod_segment_duration 2000;
  vod_align_segments_to_key_frames on;
  vod_manifest_segment_durations_mode accurate;
  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    location = /health {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # nginx-vod fetches the mapping at /mapping/hls/<video_id> (or dash) for HLS/DASH.
    # Phase 9: INTERNAL_TOKEN is injected via envsubst at container start (see Dockerfile).
    location ~ "^/mapping/(?:hls/|dash/)?(?<video_id>[0-9a-fA-F-]{36})$" {
      internal;
      proxy_pass http://metadata:8002/internal/videos/$video_id/vod;
      proxy_set_header Host metadata;
      proxy_set_header X-Internal-Token "${INTERNAL_TOKEN}";
    }

    # Mapping paths are object keys relative to the configured MinIO bucket.
    location ^~ /minio/ {
      internal;
      proxy_pass http://minio:9000/videos/;
      proxy_set_header Host minio;
      proxy_buffering off;
    }

    location ~ "^/hls/[0-9a-fA-F-]{36}/" {
      vod hls;
      vod_mode mapped;
      vod_upstream_location /mapping;
      vod_remote_upstream_location /minio;

      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    # Phase 15 cost: DASH manifests via same mapped MP4s — nginx-vod supports vod_dash (optional, not yet used by FE)
    location ~ "^/dash/[0-9a-fA-F-]{36}/" {
      vod dash;
      vod_mode mapped;
      vod_upstream_location /mapping;
      vod_remote_upstream_location /minio;

      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }
  }
}
