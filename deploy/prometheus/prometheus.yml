global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: /metrics

  - job_name: 'metadata'
    static_configs:
      - targets: ['metadata:8002']
    metrics_path: /metrics

  - job_name: 'upload'
    static_configs:
      - targets: ['upload:8003']
    metrics_path: /metrics

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:8001']
    metrics_path: /metrics

  - job_name: 'transcoder'
    static_configs:
      - targets: ['transcoder:8004']
    metrics_path: /metrics

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster

rule_files:
  - /etc/prometheus/alert.rules.yml
