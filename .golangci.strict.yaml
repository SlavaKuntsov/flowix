# Строгий набор под gopls в Zed (см. lsp.gopls в settings.json):
# staticcheck с полным набором проверок (включая ST*) + govet shadow.
# Используется в `make lint-report`, чтобы его вывод совпадал с диагностиками Zed.
version: "2"
linters:
  default: none
  enable:
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused
  settings:
    staticcheck:
      checks:
        - all
    govet:
      enable:
        - shadow
